services:
  db:
    image: postgres:18
    restart: always
    environment:
        POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in your shell environment}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell environment}
    ports:
      - "5432:5432"
    volumes:
      - "./sql:/docker-entrypoint-initdb.d"
      # Persistent volume for Postgres data, use `docker compose -v down` to flush data
      - /opt/reviewboard/postgres_data:/var/lib/postgresql

  server:
    image: rockthejvm-reviewboard-staging:1.0.0
    platform: linux/arm64
    restart: always
    ports:
      - "4041:4041"
    environment:
        DATABASE_JDBC_URL: ${DATABASE_JDBC_URL:?Set DATABASE_JDBC_URL in your shell environment}
        DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in your shell environment}
        DATABASE_PASS: ${DATABASE_PASS:?Set DATABASE_PASS in your shell environment}
        JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your shell environment}
        JWT_TTL: ${JWT_TTL:-864000}
        STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set STRIPE_SECRET_KEY in your shell environment}
        STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:?Set STRIPE_SUCCESS_URL in your shell environment}
        STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:?Set STRIPE_CANCEL_URL in your shell environment}
        STRIPE_INVITES_WEBHOOK_SECRET: ${STRIPE_INVITES_WEBHOOK_SECRET:?Set STRIPE_INVITES_WEBHOOK_SECRET in your shell environment}
        EMAIL_HOST: ${EMAIL_HOST:-smtp.ethereal.email}
        EMAIL_PORT: ${EMAIL_PORT:-587}
        EMAIL_USER: ${EMAIL_USER:?Set EMAIL_USER in your shell environment}
        EMAIL_PASSWORD: ${EMAIL_PASSWORD:?Set EMAIL_PASSWORD in your shell environment}
        EMAIL_BASE_URL: ${EMAIL_BASE_URL:?Set EMAIL_BASE_URL in your shell environment}
        OPENAI_SECRET_KEY: ${OPENAI_SECRET_KEY:?Set OPENAI_SECRET_KEY in your shell environment}

volumes:
  postgres_data:
