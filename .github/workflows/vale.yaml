name: Lint Docs
on:
  push:
    paths:
      - '**.md'
      - '.vale.ini'
      - '.github/vale-styles/config/**'
  pull_request:
    paths:
      - '**.md'
      - '.vale.ini'
      - '.github/vale-styles/config/**'

jobs:
  vale:
    name: runner / vale
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Vale Packages
        uses: actions/cache@v6
        with:
          path: .github/vale-styles
          # The key now hashes BOTH the config file and your custom vocab/styles
          key: ${{ runner.os }}-vale-styles-${{ hashFiles('.vale.ini', '.github/vale-styles/config/**') }}
          restore-keys: |
            ${{ runner.os }}-vale-styles-

      - name: Lint Documentation with Vale
        uses: vale-cli/vale-action@v3
        with:
          vale_flags: "--glob='!.*'"
          reporter: github-pr-review
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
