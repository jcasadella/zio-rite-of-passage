rockthejvm {
    db {
        poolName = "quill"
        maximumPoolSize = 5
        connectionTimeout = 30000
        transactionIsolation = TRANSACTION_SERIALIZABLE
        dataSourceClassName = org.postgresql.ds.PGSimpleDataSource
        dataSource {
            url = "jdbc:postgresql://localhost:5432/reviewboard"
            url = ${?DATABASE_JDBC_URL}
            user = "docker"
            user = ${?DATABASE_USER}
            password = "docker"
            password = ${?DATABASE_PASS}
        }
    }

    http {
        port = 4041
        port = ${?HTTP_PORT}
    }

    jwt {
        issuer = "rockthejvm.com"
        issuer = ${?JWT_ISSUER}
        secret = "mysecret"
        secret = ${?JWT_SECRET}
        ttl = 864000
        ttl = ${?JWT_TTL}
    }

    recoveryTokens {
        duration = 600000
    }

    email {
        from = "info@rockthejvm.fake"
        host = "smtp.ethereal.email"
        host = ${?EMAIL_HOST}
        port = 587
        port = ${?EMAIL_PORT}
        user = "sally65@ethereal.email"
        user = ${?EMAIL_USER}
        password = "zZJQg6MGUCAtubgSRN"
        password = ${?EMAIL_PASSWORD}
        baseUrl = "http://localhost:1234"
        baseUrl = ${?EMAIL_BASE_URL}
    }

    invites {
        nInvites = 200
    }

    stripe {
        secretKey = ${STRIPE_SECRET_KEY}
        invitesWebhookSecret = ${STRIPE_INVITES_WEBHOOK_SECRET}
        invitePackPriceId = "price_1UGy0eDzekdSsupYsaDLzkwG"
        invitePackPriceId = ${?STRIPE_INVITE_PACK_PRICE_ID}
        successUrl = "http://localhost:1234/profile"
        successUrl = ${?STRIPE_SUCCESS_URL}
        cancelUrl = "http://localhost:1234"
        cancelUrl = ${?STRIPE_CANCEL_URL}
    }

    summaries {
        minReviews = 3
        nSelected = 20
    }

    openAi {
        baseUrl = "https://api.openai.com"
        secretKey = ${OPENAI_SECRET_KEY}
    }
}
