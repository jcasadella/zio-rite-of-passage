name: Scala CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21' 
          distribution: 'temurin'
          cache: 'sbt' 

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Cache target directories
        uses: actions/cache@v5
        with:
          path: |
            target/
            project/target/
          key: ${{ runner.os }}-sbt-target-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/**.scala') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sbt-target-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/**.scala') }}-
            ${{ runner.os }}-sbt-target-

      - name: Run Scala Tests
        run: sbt test
        env:
          STRIPE_SECRET_KEY: test-secret-key
          STRIPE_INVITES_WEBHOOK_SECRET: test-webhook-secret
          OPENAI_SECRET_KEY: test-secret-key

  deploy-staging:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: sbt

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      # 1. Build backend and frontend, and upload them to the staging server
      - name: Build backend Docker image
        run: |
          set -euo pipefail
          VERSION="$(sbt -batch -error 'print stagingBuild / version' \
            | sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' \
            | grep -Eo '^[[:space:]]*[0-9][A-Za-z0-9_.-]*[[:space:]]*$' \
            | tr -d '[:space:]' \
            | tail -n 1)"
          if [[ -z "$VERSION" ]]; then
            printf 'SBT returned an empty stagingBuild version\n' >&2
            exit 1
          fi
          sbt "stagingBuild / Docker / publishLocal"
          IMAGE="rockthejvm-reviewboard-staging:${VERSION}"
          printf 'Saving image tag: %s\n' "$IMAGE"
          docker image inspect "$IMAGE" >/dev/null
          docker image save --output server.tar "$IMAGE"

      - name: Build optimized Scala.js frontend
        run: sbt "app / Compile / fullLinkJS"

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm install
        working-directory: modules/app

      - name: Package frontend
        run: npm run build-staging
        working-directory: modules/app

      - name: Upload backend files to staging
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2222
          source: docker-compose.yml,server.tar
          target: "/opt/reviewboard"
          overwrite: true

      - name: Upload frontend to staging
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2222
          source: modules/app/dist-staging/*
          target: "/opt/reviewboard/html"
          overwrite: true

      # 2. Configure staging server with Ansible
      - name: Install Ansible
        run: pipx install ansible
      
      - name: Execute Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          # 1. Start the SSH agent in the background
          eval $(ssh-agent -s)
          
          # 2. Pipe the secret directly into the agent's memory (never hits the disk)
          echo "${{ secrets.SERVER_SSH_KEY }}" | ssh-add -
          
          # 3. Run the playbook (Ansible automatically uses the active SSH agent)
          cd ansible
          ansible-playbook -i inventory.ini playbook.yml --limit staging

      # 3. SSH into the server, authenticate Infisical, and start the app
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2222
          script: |
            # Navigate to the deployment directory
            cd /opt/reviewboard
            
            # Load the Infisical Machine Identity credentials and Project ID
            source /opt/reviewboard/.env.infisical-staging
            
            # Authenticate the server against the EU Infisical cloud
            export INFISICAL_TOKEN=$(infisical login \
              --method=universal-auth \
              --client-id="$INFISICAL_CLIENT_ID" \
              --client-secret="$INFISICAL_CLIENT_SECRET" \
              --domain="$INFISICAL_API_URL" \
              --plain \
              --silent)

            docker load -i server.tar
            
            infisical run --projectId="$INFISICAL_PROJECT_ID" --env=staging -- docker compose up -d --remove-orphans
