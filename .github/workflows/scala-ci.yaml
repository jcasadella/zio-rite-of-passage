name: Scala CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21' 
          distribution: 'temurin'
          cache: 'sbt' 

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Cache target directories
        uses: actions/cache@v5
        with:
          path: |
            target/
            project/target/
          key: ${{ runner.os }}-sbt-target-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/**.scala') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sbt-target-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/**.scala') }}-
            ${{ runner.os }}-sbt-target-

      - name: Run Scala Tests
        run: sbt test
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_INVITES_WEBHOOK_SECRET: ${{ secrets.STRIPE_INVITES_WEBHOOK_SECRET }}
          OPENAI_SECRET_KEY: ${{ secrets.OPENAI_SECRET_KEY }}
