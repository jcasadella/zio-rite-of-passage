---
- name: Provision Server
  hosts: all
  become: yes
  vars_files:
    # Loads vars file depending on env, default is vars_staging.yml
    - "vars_{{ env | default('staging') }}.yml"

  tasks:
    # --- 1. Docker & Docker Compose Setup ---
    - name: Install prerequisite packages for Docker
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - gnupg
        state: present
        update_cache: yes

    - name: Configure Docker APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
        signed_by: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Install Docker and Docker Compose Plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is running and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add user holu to docker group
      ansible.builtin.user:
        name: holu
        groups: docker
        append: yes

    # --- Infisical CLI Setup ---
    - name: Download Infisical repository setup script
      ansible.builtin.get_url:
        url: https://artifacts-cli.infisical.com/setup.deb.sh
        dest: /tmp/setup_infisical.sh
        mode: '0700'

    - name: Configure Infisical apt repository
      ansible.builtin.command: /tmp/setup_infisical.sh
      args:
        # Prevents the script from running again if the repo is already added
        creates: /etc/apt/sources.list.d/infisical-infisical-cli.list
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Install Infisical CLI
      ansible.builtin.apt:
        name: infisical
        state: present
        update_cache: yes

    # --- 2. Nginx Setup ---
    - name: Install Nginx and Certbot
      ansible.builtin.apt:
        name:
          - nginx
        state: present

    - name: Ensure snapd is installed (Required for Certbot)
      ansible.builtin.apt:
        name: snapd
        state: present

    - name: Ensure snap core is up to date
      community.general.snap:
        name: core
        state: present

    - name: Refresh snap core
      command: snap refresh core
      register: snap_refresh
      changed_when: "'has no updates available' not in snap_refresh.stderr and 'has no updates available' not in snap_refresh.stdout"

    - name: Install Certbot via Snap
      community.general.snap:
        name: certbot
        classic: yes
        state: present

    - name: Create symlink for Certbot
      file:
        src: /snap/bin/certbot
        dest: /usr/bin/certbot
        state: link

    - name: Create backend files directory
      file:
        path: "{{ backend_files_path }}"
        state: directory
        mode: '0755'
        owner: holu
        group: holu

    - name: Create static files directory
      file:
        path: "{{ static_files_path }}"
        state: directory
        mode: '0755'
        owner: holu
        group: holu

    - name: Deploy Nginx configuration
      template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/{{ domain_name }}
      notify:
        - Reload Nginx
        - Reinstall Certbot SSL

    - name: Enable the Nginx site
      file:
        src: /etc/nginx/sites-available/{{ domain_name }}
        dest: /etc/nginx/sites-enabled/{{ domain_name }}
        state: link
      notify: Reload Nginx

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    # --- Firewall & Security Setup ---
    - name: Ensure UFW is installed
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Allow custom SSH port
      community.general.ufw:
        rule: allow
        port: '2222'
        proto: tcp

    - name: Ensure standard SSH port is closed
      community.general.ufw:
        rule: deny
        port: '22'
        proto: tcp

    - name: Allow HTTP and HTTPS traffic (Nginx Full)
      community.general.ufw:
        rule: allow
        name: Nginx Full

    - name: Enable UFW and deny incoming by default
      community.general.ufw:
        state: enabled
        default: deny

    - name: Install fail2ban
      ansible.builtin.apt:
        name: fail2ban
        state: present

    - name: Configure fail2ban to use UFW
      copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          # Tell fail2ban to use ufw instead of raw iptables
          banaction = ufw
          banaction_allports = ufw

          [sshd]
          enabled = true
          port = 2222
          # Ban for 1 hour after 3 failed attempts
          bantime = 3600
          maxretry = 3
      notify: Restart fail2ban

    # We must force Ansible to reload Nginx now so Certbot can verify the domain
    - name: Flush handlers
      meta: flush_handlers

    # --- 3. Let's Encrypt Setup ---
    - name: Obtain Let's Encrypt certificate
      command: certbot --nginx -d {{ domain_name }} -m {{ email }} --agree-tos --non-interactive --redirect
      args:
        # This prevents Certbot from requesting a new cert every time you run Ansible
        creates: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem
      # If DNS hasn't propagated yet, don't fail the whole playbook
      ignore_errors: yes
      notify: Reload Nginx

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
    - name: Reinstall Certbot SSL
      command: certbot install --nginx --cert-name {{ domain_name }} --non-interactive --redirect